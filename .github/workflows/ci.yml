name: CI/CD - Tic Tac Toe

on:
    push:
        branches: [ "main" ]
    pull_request:
        branches: [ "main", "feature/*"]

jobs:
    test:
        name: CI/CD - Testes automatizados
        runs-on: ubuntu-latest
        steps:  
            - name: Checkout do código
              uses: actions/checkout@v4
            
            - name: Configurar Python
              uses: actions/setup-python@v4
              with:
                python-version: '3.11'

            - name: Instalar dependências
              run: pip install -r requirements.txt

            - name: Executar testes
              run: python -m pytest tests/test_app.py
            
    build-and-push:
        name: CD - Build e push da imagem Docker
        runs-on: ubuntu-latest
        needs: test                                   # só roda se o job "test" passar
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # a condição acima garante que Pull Requests NUNCA publicam imagem —
        # só um push direto na main dispara a publicação no Docker Hub
        steps:
            - name: Checkout do código
              uses: actions/checkout@v4

            - name: Login no Docker Hub
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}   # lidos dos Secrets do repo,
                password: ${{ secrets.DOCKERHUB_TOKEN }}       # nunca do código-fonte

            - name: Build e push da imagem
              uses: docker/build-push-action@v6
              with:
                context: .
                push: true
                tags: ${{ secrets.DOCKERHUB_USERNAME }}/tic-tac-toe:latest